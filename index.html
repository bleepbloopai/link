<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Link Dump</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&display=swap">
<style>
:root{--bg:#e8edf1;--ink:#14213d;--dim:#5b6780;--rule:#c3ccd6;--hl:#ffe14d;--onhl:#14213d;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#10151f;--ink:#e6ebf2;--dim:#8d9ab0;--rule:#2a3446;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.4 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--ink);padding:1rem clamp(1rem,4vw,3rem) .9rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:.5rem 2rem}
h1{margin:0;font-weight:800;font-size:clamp(2rem,6vw,3.4rem);line-height:1;letter-spacing:-.03em}
.sub{margin:0;color:var(--dim);font-size:.95rem;flex:1 1 16rem}
input{flex:1 1 100%;font:inherit;font-size:1.1rem;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--rule);padding:.5rem 0;outline:0}
input:focus{border-bottom-color:var(--ink)}
input::placeholder{color:var(--dim)}
main{columns:15rem auto;column-gap:2.5rem;padding:1.5rem clamp(1rem,4vw,3rem) 4rem}
section{break-inside:avoid;margin:0 0 2rem}
h2{margin:0 0 .4rem;font-size:1.15rem;font-weight:800;letter-spacing:-.01em;border-bottom:1px solid var(--ink);padding-bottom:.25rem;display:flex;justify-content:space-between;gap:1rem}
h2 small{font-weight:400;color:var(--dim);font-size:.85rem}
a{display:block;color:var(--ink);text-decoration:none;padding:.15rem .35rem;margin:0 -.35rem;border-radius:2px}
a:hover,a:focus-visible{background:var(--hl);color:var(--onhl);outline:0}
a.top{box-shadow:inset 3px 0 0 var(--hl)}
#td{padding:0 clamp(1rem,4vw,3rem) 3rem}
#tdl{columns:15rem auto;column-gap:2.5rem}
#tdl a{break-inside:avoid}
#tdn{margin:.25rem 0 1rem;color:var(--dim);font-size:.9rem}
#tdm{font:inherit;font-weight:800;color:var(--ink);background:transparent;border:2px solid var(--ink);border-radius:2px;padding:.5rem 1rem;margin-top:1.5rem;cursor:pointer}
#tdm:hover:not(:disabled),#tdm:focus-visible{background:var(--hl);color:var(--onhl);outline:0}
#tdm:disabled{opacity:.5;cursor:default}
#none{padding:2rem clamp(1rem,4vw,3rem);color:var(--dim)}
footer{padding:0 clamp(1rem,4vw,3rem) 3rem;color:var(--dim);font-size:.85rem}
</style>

<body>
<header>
  <h1>Link Dump</h1>
  <p class="sub"><span id="n">0</span> links. Press / to filter, Enter to open the top match.</p>
  <input id="q" type="search" placeholder="Filter by name or site" autocomplete="off" aria-label="Filter links">
</header>
<main id="m"></main>
<p id="none" hidden>No links match. Try fewer letters.</p>
<section id="td" aria-labelledby="tdh">
  <h2 id="tdh">Top sites <small id="tdc"></small></h2>
  <p id="tdn"></p>
  <div id="tdl"></div>
  <button id="tdm" type="button">Load more sites</button>
</section>
<footer>To add a link, put a line like <code>Name|example.com/path</code> in any list below.</footer>

const main=document.getElementById('m'),q=document.getElementById('q'),n=document.getElementById('n'),none=document.getElementById('none');
const secs=D.map(([title,raw])=>{
  const sec=document.createElement('section'),h=document.createElement('h2'),cnt=document.createElement('small');
  h.append(title,cnt);sec.append(h);
  const links=raw.trim().split('\n').map(line=>{
    const [name,addr]=line.split('|'),a=document.createElement('a');
    a.href='https://'+addr.trim();a.target='_blank';a.rel='noopener noreferrer';a.textContent=name;
    a.dataset.k=(name+' '+addr).toLowerCase();sec.append(a);return a;
  });
  main.append(sec);
  return {sec,cnt,links};
});
const total=secs.reduce((s,x)=>s+x.links.length,0);

function filter(){
  const t=q.value.trim().toLowerCase();let shown=0,first=null;
  secs.forEach(({sec,cnt,links})=>{
    let c=0;
    links.forEach(a=>{
      const ok=!t||a.dataset.k.includes(t);
      a.hidden=!ok;a.classList.remove('top');
      if(ok){c++;if(!first)first=a;}
    });
    sec.hidden=!c;cnt.textContent=c;shown+=c;
  });
  if(t&&first)first.classList.add('top');
  n.textContent=t?shown+' of '+total:total;
  curShown=shown;term=t;shownN=PAGE;renderTD();
}
q.addEventListener('input',filter);
q.addEventListener('keydown',e=>{
  if(e.key==='Enter'){const a=document.querySelector('a.top');if(a)window.open(a.href,'_blank','noopener');}
  if(e.key==='Escape'){q.value='';filter();q.blur();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus();}
});
// Top sites: read straight from the source file in chunks, so the page stays small.
const SRC='https://raw.githubusercontent.com/danielmiessler/top-domains/refs/heads/main/alexa-top-1Million.txt';
const CHUNK=250000,PAGE=600;
const tdList=document.getElementById('tdl'),tdMore=document.getElementById('tdm'),tdNote=document.getElementById('tdn'),tdCount=document.getElementById('tdc');
let doms=[],pos=0,done=false,loading=false,err=false,shownN=PAGE,hits=[],term='',curShown=total;

function renderTD(){
  hits=term?doms.filter(d=>d.includes(term)):doms;
  const f=document.createDocumentFragment();
  hits.slice(0,shownN).forEach(d=>{
    const a=document.createElement('a');
    a.href='https://'+d;a.target='_blank';a.rel='noopener noreferrer';a.textContent=d;f.append(a);
  });
  tdList.replaceChildren(f);
  tdCount.textContent=hits.length.toLocaleString()+(done?'':'+');
  tdNote.textContent=err?'Couldn’t load the list. Check your connection, then try again.'
    :term&&!done?'Searching the '+doms.length.toLocaleString()+' sites loaded so far. Load more to search further.'
    :'Most-visited domains in rank order, from the Alexa top 1 million list.';
  const more=hits.length>shownN;
  tdMore.hidden=!(more||!done);
  tdMore.disabled=loading;
  tdMore.textContent=loading?'Loading…':more?'Show more':err?'Try again':'Load more sites';
  none.hidden=curShown>0||hits.length>0;
}

async function loadChunk(){
  if(loading||done)return;
  loading=true;err=false;renderTD();
  try{
    const r=await fetch(SRC,{headers:{Range:'bytes='+pos+'-'+(pos+CHUNK-1)}});
    if(r.status===416)done=true;
    else if(!r.ok)throw new Error(r.status);
    else{
      const t=await r.text();
      let body=t;
      if(r.status===200){done=true;doms=[];pos=0;}            // server ignored Range: this is the whole file
      else if(t.length>=CHUNK)body=t.slice(0,t.lastIndexOf('\n')+1);
      else done=true;                                           // short chunk: end of file
      pos+=body.length;
      doms=doms.concat(body.split(/\r?\n/).filter(Boolean));
    }
  }catch(e){err=true}
  loading=false;renderTD();
}

tdMore.addEventListener('click',()=>{
  if(hits.length>shownN){shownN+=PAGE;renderTD();}
  else loadChunk();
});

filter();
loadChunk();
</script>
